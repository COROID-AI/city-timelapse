<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Era Timelapse 3D</title>
  <style>
    :root{
      --bg: #070a12;
      --panel: rgba(10,14,26,0.65);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.70);
      --accent: #7cf7ff;
      --shadow: 0 16px 50px rgba(0,0,0,0.45);
    }
    html, body {
      height: 100%;
      margin: 0;
      background: radial-gradient(1200px 600px at 60% 10%, rgba(124,247,255,0.16), rgba(0,0,0,0) 60%), var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      overflow: hidden;
    }
    #3d-scene {
      position: fixed;
      inset: 0;
      outline: none;
    }
    #ui {
      position: fixed;
      top: 14px;
      left: 0;
      right: 0;
      z-index: 10;
      pointer-events: none;
    }
    .timeline {
      width: min(980px, calc(100% - 24px));
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(10,14,26,0.70), rgba(10,14,26,0.55));
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 14px 16px 12px;
      pointer-events: auto;
      backdrop-filter: blur(12px);
    }
    .timeline-title {
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      margin-bottom: 10px;
    }
    .timeline-row{
      display:flex;
      align-items:center;
      gap: 14px;
    }
    .year-slider{
      flex: 1;
      appearance: none;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(124,247,255,0.95), rgba(138,125,255,0.95));
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
    }
    .year-slider::-webkit-slider-thumb{
      appearance:none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.2) 35%, rgba(0,0,0,0.2) 60%), linear-gradient(180deg, rgba(124,247,255,1), rgba(138,125,255,1));
      border: 1px solid rgba(255,255,255,0.25);
      box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    }
    .year-pill{
      min-width: 88px;
      text-align:center;
      padding: 10px 12px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.06));
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.95);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .timeline-options{
      display:flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .timeline-hint{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.66);
    }
    .cursor-hint{
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 11;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      padding: 10px 12px;
      border-radius: 12px;
      color: rgba(255,255,255,0.85);
      backdrop-filter: blur(10px);
      pointer-events:none;
      max-width: 520px;
      display:none;
    }
    .era-description{
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.78);
      font-style: italic;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="timeline" aria-label="Timeline">
      <div class="timeline-title">City Era Timelapse</div>
      <div class="timeline-row">
        <input id="yearSlider" class="year-slider" type="range" min="0" max="5" step="1" value="0" />
        <div class="year-pill" id="yearPill">1945</div>
      </div>
      <div class="timeline-options" aria-hidden="true">
        <span>1945</span><span>1965</span><span>1985</span><span>2005</span><span>2025</span><span>2055</span>
      </div>
      <div class="era-description" id="eraDesc"></div>
      <div class="timeline-hint">Drag to change eras. Click the scene to enable movement (WASD).</div>
    </div>
  </div>

  <div id="3d-scene" tabindex="0" aria-label="3D Scene"></div>
  <div class="cursor-hint" id="cursorHint">Click to enable movement · WASD to navigate · Mouse drag to orbit</div>

  <script src="/three.min.js"></script>
  <script>
    const THREE = window.THREE;

    // ----------------------------
    // Timeline configuration
    // ----------------------------
    const YEARS = [1945, 1965, 1985, 2005, 2025, 2055];

    const ERA_PRESETS = {
      1945: {
        sky: 0x9ec9ff, fog: 0xcfe7ff, fogNear: 22, fogFar: 115,

      },

        streetColor: 0x20232b, grassColor: 0x1f6a36,
        buildingHeights: [6, 24],
        buildingColors: [0xf2f2f2, 0xcccccc, 0x8ad0ff, 0x87a7ff],
        windowColors: [0x9ef2ff, 0xffffff, 0xa7ffd9],
        billboardColors: [0xff5af7, 0x00ffa3, 0x5a7bff],
        car: { color: 0x7b1fa2, accent: 0xffd7ff },
        pedestrians: { count: 20, outfit: 0x10222f },
        neon: true,
        sfxProfile: { wind: 0.14, traffic: 0.8, hum: 0.28 },
        description: "Contemporary — Glass facades, SUVs, digital billboards"
      },
      2025: {
        sky: 0x8de0ff, fog: 0xe6ffff, fogNear: 24, fogFar: 175,
        streetColor: 0x1e2129, grassColor: 0x1b5f2f,
        buildingHeights: [10, 30],
        buildingColors: [0x12d7ff, 0xff2de0, 0xf9ff72, 0xffffff, 0x0e0f2a],
        windowColors: [0x74ffd7, 0x7ac7ff, 0xfff6b0],
        billboardColors: [0x00ffd2, 0xff00a8, 0xfff200],
        car: { color: 0x12ff6a, accent: 0xeffff7 },
        pedestrians: { count: 24, outfit: 0x0b1a22 },
        neon: true,
        sfxProfile: { wind: 0.1, traffic: 0.85, hum: 0.34 },
        description: "Near Future — Smart buildings, electric vehicles, vertical gardens"
      },
      2055: {
        sky: 0x5ad5ff, fog: 0xf2feff, fogNear: 18, fogFar: 195,
        streetColor: 0x171923, grassColor: 0x145a2b,
        buildingHeights: [18, 52],
        buildingColors: [0xff69b4, 0x00ffff, 0xffd700, 0xffffff, 0x0a0b18],
        windowColors: [0x7cfffb, 0xfff1c2, 0xffa3ff],
        billboardColors: [0xffa500, 0x00ffff, 0xff4dff],
        car: { color: 0xffa500, accent: 0xfff7e2 },
        pedestrians: { count: 26, outfit: 0x071017 },
        neon: true,
        sfxProfile: { wind: 0.06, traffic: 0.92, hum: 0.42 },
        description: "Futuristic — Flying vehicles, advanced materials, holographic displays"
      }
    };

    // ----------------------------
    // Deterministic PRNG
    // ----------------------------
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6d2b79f5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    function seededRange(rand, min, max) { return min + (max - min) * rand(); }
    function pick(rand, arr) { return arr[Math.floor(rand() * arr.length)]; }

    // ----------------------------
    // Canvas textures
    // ----------------------------
    function makeRoadTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1c1c1c';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 20; i++) {
        const x = i * 25 + (Math.random() * 4);
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,255,180,0.25)';
      ctx.setLineDash([18, 14]); ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(c.width / 2, 0); ctx.lineTo(c.width / 2, c.height); ctx.stroke();
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    function makeSidewalkTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#2c2c2c';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 10; i++) {
        for (let j = 0; j < 10; j++) {
          const x = i * 25; const y = j * 25;
          ctx.strokeRect(x + 2, y + 2, 20, 20);
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(10, 10);
      return tex;
    }

    function makeGrassTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#2b7a3f';
      ctx.fillRect(0, 0, c.width, c.height);
      for (let i = 0; i < 1400; i++) {
        const x = Math.random() * c.width;
        const y = Math.random() * c.height;
        const h = 3 + Math.random() * 12;
        ctx.strokeStyle = `rgba(0,0,0,${0.05 + Math.random() * 0.08})`;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random() - 0.5) * 2, y - h); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 6);
      return tex;
    }

    // ----------------------------
    // SFX (synthesized via Web Audio)
    // ----------------------------
    class CitySFX {
      constructor(camera) {
        this.camera = camera;
        this.ctx = null;
        this.master = null;
        this.enabled = false;
      }
      ensure() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0;
        this.master.connect(this.ctx.destination);

        // Wind: filtered noise
        const noiseBuffer = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.6;
        const noise = this.ctx.createBufferSource();
        noise.buffer = noiseBuffer; noise.loop = true;

        const windFilter = this.ctx.createBiquadFilter();
        windFilter.type = 'bandpass'; windFilter.frequency.value = 350; windFilter.Q.value = 0.7;
        const windGain = this.ctx.createGain(); windGain.gain.value = 0.25;
        noise.connect(windFilter); windFilter.connect(windGain); windGain.connect(this.master);
        this.wind = { noise, windFilter, windGain };

        // Hum (low engine)
        const humOsc = this.ctx.createOscillator();
        humOsc.type = 'sine'; humOsc.frequency.value = 60;
        const humGain = this.ctx.createGain(); humGain.gain.value = 0.18;
        humOsc.connect(humGain); humGain.connect(this.master);
        this.hum = { humOsc, humGain };

        // Traffic: noise bursts via LFO
        const trafficBuffer = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
        const td = trafficBuffer.getChannelData(0);
        for (let i = 0; i < td.length; i++) td[i] = (Math.random() * 2 - 1) * 0.65;
        const trafficSrc = this.ctx.createBufferSource();
        trafficSrc.buffer = trafficBuffer; trafficSrc.loop = true;
        const trafficFilter = this.ctx.createBiquadFilter();
        trafficFilter.type = 'lowpass'; trafficFilter.frequency.value = 900;
        const trafficGain = this.ctx.createGain(); trafficGain.gain.value = 0;
        trafficSrc.connect(trafficFilter); trafficFilter.connect(trafficGain); trafficGain.connect(this.master);

        const lfo = this.ctx.createOscillator();
        lfo.type = 'sawtooth'; lfo.frequency.value = 1.2;
        const lfoGain = this.ctx.createGain(); lfoGain.gain.value = 0.22;
        lfo.connect(lfoGain); lfoGain.connect(trafficGain.gain);
        this.traffic = { trafficSrc, trafficFilter, trafficGain, lfo };

        noise.start(); trafficSrc.start(); humOsc.start(); lfo.start();
      }
      async start() {
        this.ensure();
        if (this.enabled) return;
        await this.ctx.resume();
        this.enabled = true;
        const now = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(now);
        this.master.gain.setTargetAtTime(0.75, now, 0.25);
      }
      setProfile(profile) {
        this.ensure();
        const now = this.ctx.currentTime;
        const wind = profile.wind ?? 0.1;
        const traffic = profile.traffic ?? 0.7;
        const hum = profile.hum ?? 0.2;
        this.wind.windGain.gain.cancelScheduledValues(now);
        this.wind.windGain.gain.setTargetAtTime(0.05 + wind * 0.55, now, 0.18);
        this.wind.windFilter.frequency.setTargetAtTime(260 + wind * 380, now, 0.18);
        this.traffic.trafficFilter.frequency.setTargetAtTime(600 + traffic * 700, now, 0.18);
        this.traffic.trafficGain.gain.cancelScheduledValues(now);
        this.traffic.trafficGain.gain.setTargetAtTime(0.04 + traffic * 0.35, now, 0.18);
        this.hum.humOsc.frequency.setTargetAtTime(45 + hum * 70, now, 0.18);
        this.hum.humGain.gain.setTargetAtTime(0.08 + hum * 0.25, now, 0.18);
      }
      async blip() {
        this.ensure();
        const now = this.ctx.currentTime;
        this.master.gain.cancelScheduledValues(now);
        this.master.gain.setValueAtTime(this.master.gain.value, now);
        this.master.gain.setTargetAtTime(0.95, now, 0.03);
        this.master.gain.setTargetAtTime(0.75, now + 0.25, 0.12);
      }
    }

    // ----------------------------
    // City creation
    // ----------------------------
    const textures = { road: null, sidewalk: null, grass: null };

    function disposeGroup(group) {
      if (!group) return;
      group.traverse((obj) => {
        if (obj.geometry) obj.geometry.dispose?.();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach((m) => m.dispose?.());
          else obj.material.dispose?.();
        }
      });
    }

    function makeBillboardMaterial(colors, rand, neon) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < 10; i++) {
        ctx.fillStyle = `rgba(255,255,255,${0.05 + rand() * 0.08})`;
        ctx.fillRect(i * 26, 0, 18, canvas.height);
      }
      const c1 = pick(rand, colors);
      const c2 = pick(rand, colors);
      ctx.fillStyle = `#${c1.toString(16).padStart(6, '0')}`;
      ctx.globalAlpha = 0.92;
      ctx.fillRect(0, 35, canvas.width, 58);
      ctx.fillStyle = `#${c2.toString(16).padStart(6, '0')}`;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(0, 45, canvas.width, 40);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.86)';
      ctx.font = 'bold 20px system-ui';
      ctx.fillText(neon ? 'NEON SALE' : 'CITY LIFE', 22, 80);
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 8;
      return new THREE.MeshStandardMaterial({
        map: tex,
        emissive: neon ? new THREE.Color(0x3bffea) : new THREE.Color(0x000000),
        emissiveIntensity: neon ? 0.5 : 0
      });
    }

    function createBuilding(rand, preset, x, z) {
      const [hMin, hMax] = preset.buildingHeights;
      const height = seededRange(rand, hMin, hMax);
      const w = seededRange(rand, 2.6, 6.2);
      const d = seededRange(rand, 2.0, 5.2);
      const baseColor = pick(rand, preset.buildingColors);
      const mat = new THREE.MeshStandardMaterial({
        color: baseColor,
        metalness: 0.08 + rand() * 0.18,
        roughness: 0.45 + rand() * 0.45,
        emissive: preset.neon ? new THREE.Color(0x08202a) : new THREE.Color(0x000000),
        emissiveIntensity: preset.neon ? 0.08 + rand() * 0.12 : 0
      });
      const group = new THREE.Group();
      const main = new THREE.Mesh(new THREE.BoxGeometry(w, height, d), mat);
      main.position.y = height / 2;
      group.add(main);

      if (rand() > 0.55) {
        const roof = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.12, 0.8 + rand() * 1.6, 8),
          new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.25, metalness: 0.7 })
        );
        roof.position.set(0, height + roof.geometry.parameters.height / 2, 0);
        group.add(roof);
      }

      if (rand() > 0.35) {
        const signH = 0.35 + rand() * 0.65;
        const signW = w * (0.35 + rand() * 0.4);
        const signMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          emissive: preset.neon ? new THREE.Color(pick(rand, preset.billboardColors)) : new THREE.Color(0x000000),
          emissiveIntensity: preset.neon ? 0.75 : 0,
          roughness: 0.25, metalness: 0.3
        });
        const sign = new THREE.Mesh(new THREE.BoxGeometry(signW, signH, 0.15), signMat);
        sign.position.set(0, height + signH / 2, d / 2 + 0.08);
        group.add(sign);
      }

      const windowColor = pick(rand, preset.windowColors);
      const windowMat = new THREE.MeshStandardMaterial({
        color: windowColor,
        roughness: 0.25 + rand() * 0.35,
        metalness: 0.02,
        emissive: preset.neon ? new THREE.Color(windowColor) : new THREE.Color(0x000000),
        emissiveIntensity: preset.neon ? 0.4 + rand() * 0.65 : 0
      });
      const columns = Math.floor(2 + rand() * 5);
      const rows = Math.floor(2 + rand() * 6);
      const padX = (w * 0.15);
      const padZ = (d * 0.18);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < columns; c++) {
          const ww = w / columns * (0.55 + rand() * 0.25);
          const wh = height / rows * (0.18 + rand() * 0.28);
          const gapX = w / columns;
          const gapY = height / rows;
          if (rand() > 0.82) continue;
          const xPos = -w / 2 + padX + c * gapX + (rand() - 0.5) * 0.15;
          const yPos = gapY * (r + 0.5) + (rand() - 0.5) * 0.08 - height / 2;
          const win = new THREE.Mesh(new THREE.BoxGeometry(ww, wh, 0.06), windowMat);
          win.position.set(xPos, yPos, d / 2 + 0.04);
          group.add(win);
        }
      }
      group.position.set(x, 0, z);
      return group;
    }

    function createStreetFurniture(rand, preset, x, z, tag) {
      const group = new THREE.Group();
      if (tag === 'lamp') {
        const poleH = 2.8 + rand() * 2.8;
        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.06, 0.08, poleH, 10),
          new THREE.MeshStandardMaterial({ color: 0x6b6b6b, metalness: 0.7, roughness: 0.25 })
        );
        pole.position.y = poleH / 2;
        group.add(pole);
        const light = new THREE.Mesh(
          new THREE.ConeGeometry(0.22, 0.65, 8),
          new THREE.MeshStandardMaterial({
            color: 0xfff0b0,
            emissive: new THREE.Color(0xfff0b0),
            emissiveIntensity: preset.neon ? 1.6 : 1.1,
            roughness: 0.2, metalness: 0
          })
        );
        light.position.set(0, poleH + 0.35, 0);
        group.add(light);
        const base = new THREE.Mesh(
          new THREE.BoxGeometry(0.45, 0.12, 0.45),
          new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.3, roughness: 0.8 })
        );
        base.position.y = 0.06;
        group.add(base);
        group.position.set(x, 0, z);
        return group;
      }
      if (tag === 'billboard') {
        const boardW = 1.4 + rand() * 2.2;
        const boardH = 1.1 + rand() * 1.6;
        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(boardW, boardH, 0.08),
          new THREE.MeshStandardMaterial({ color: 0x2c2c2c, metalness: 0.25, roughness: 0.8 })
        );
        frame.position.y = boardH / 2;
        group.add(frame);
        const mat = makeBillboardMaterial(preset.billboardColors, rand, preset.neon);
        const face = new THREE.Mesh(new THREE.BoxGeometry(boardW * 0.98, boardH * 0.98, 0.02), mat);
        face.position.y = boardH / 2; face.position.z = 0.04;
        group.add(face);
        const poleH = 2 + rand() * 1.5;
        const pole = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.06, poleH, 10),
          new THREE.MeshStandardMaterial({ color: 0x5c5c5c, metalness: 0.6, roughness: 0.35 })
        );
        pole.position.y = poleH / 2;
        group.add(pole);
        group.position.set(x, 0, z);
        return group;
      }
      return group;
    }

    function createPedestrian(rand, preset) {
      const group = new THREE.Group();
      const bodyH = 0.55 + rand() * 0.35;
      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.14, bodyH, 6, 14),
        new THREE.MeshStandardMaterial({ color: preset.pedestrians.outfit, roughness: 0.75, metalness: 0.05 })
      );
      body.position.y = bodyH / 2;
      group.add(body);
      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.11, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xf2c9a8, roughness: 0.8 })
      );
      head.position.y = bodyH + 0.12;
      group.add(head);
      const walkColor = new THREE.MeshStandardMaterial({ color: 0x2b1a2b, roughness: 0.6, metalness: 0.05 });
      const shoe = (side) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.05, 0.22), walkColor);
        m.position.set(side * 0.08, 0.09, 0);
        return m;
      };
      group.add(shoe(-1));
      group.add(shoe(1));
      if (rand() > 0.5) {
        const back = new THREE.Mesh(
          new THREE.BoxGeometry(0.13, 0.18, 0.07),
          new THREE.MeshStandardMaterial({ color: 0x3a3a55, roughness: 0.7 })
        );
        back.position.set(0, 0.55, 0.11);
        group.add(back);
      }
      return group;
    }

    function createVehicle(rand, preset) {
      const g = new THREE.Group();
      const len = 2.3 + rand() * 1.8;
      const wid = 0.9 + rand() * 0.35;
      const ht = 0.45 + rand() * 0.3;
      const bodyMat = new THREE.MeshStandardMaterial({
        color: preset.car.color, metalness: 0.6, roughness: 0.25,
        emissive: preset.neon ? new THREE.Color(preset.car.accent) : new THREE.Color(0x000000),
        emissiveIntensity: preset.neon ? 0.4 : 0
      });
      const body = new THREE.Mesh(new THREE.BoxGeometry(wid, ht, len), bodyMat);
      body.position.y = ht / 2;
      g.add(body);
      const winMat = new THREE.MeshStandardMaterial({
        color: 0x0d1325, metalness: 0.1, roughness: 0.12,
        emissive: preset.neon ? new THREE.Color(0x3bffea) : new THREE.Color(0x000000),
        emissiveIntensity: preset.neon ? 0.3 : 0
      });
      const win = new THREE.Mesh(new THREE.BoxGeometry(wid * 0.88, ht * 0.6, len * 0.55), winMat);
      win.position.set(0, ht * 0.9, 0);
      g.add(win);
      const lightMat = new THREE.MeshStandardMaterial({
        color: preset.neon ? 0x9dfff6 : 0xfff8c2,
        emissive: preset.neon ? new THREE.Color(0x9dfff6) : new THREE.Color(0xfff8c2),
        emissiveIntensity: preset.neon ? 2.0 : 1.2,
        roughness: 0.2, metalness: 0
      });
      const head = new THREE.Mesh(new THREE.BoxGeometry(wid * 0.14, ht * 0.12, 0.22), lightMat);
      head.position.set(0, ht * 0.65, len * 0.38);
      g.add(head);
      const tail = new THREE.Mesh(new THREE.BoxGeometry(wid * 0.14, ht * 0.12, 0.22), new THREE.MeshStandardMaterial({
        color: 0xff4d7a,
        emissive: preset.neon ? new THREE.Color(0xff4d7a) : new THREE.Color(0xff4d7a),
        emissiveIntensity: preset.neon ? 1.9 : 1.0,
        roughness: 0.25, metalness: 0
      }));
      tail.position.set(0, ht * 0.65, -len * 0.38);
      g.add(tail);
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x0b0b0c, metalness: 0.2, roughness: 0.95 });
      const wheelRad = 0.18 + rand() * 0.09;
      const wheelW = 0.08 + rand() * 0.05;
      const wheelGeo = new THREE.CylinderGeometry(wheelRad, wheelRad, wheelW, 10);
      const positions = [
        [wid * 0.42, 0.17, len * 0.28],
        [-wid * 0.42, 0.17, len * 0.28],
        [wid * 0.42, 0.17, -len * 0.28],
        [-wid * 0.42, 0.17, -len * 0.28]
      ];
      positions.forEach(([wx, wy, wz]) => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(wx, wy, wz);
        g.add(wheel);
      });
      if (preset.neon) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(wid * 0.55, 0.03, 10, 24),
          new THREE.MeshStandardMaterial({
            color: preset.car.accent, emissive: preset.car.accent, emissiveIntensity: 1.2,
            metalness: 0.2, roughness: 0.35
          })
        );
        ring.rotation.x = Math.PI / 2;
        ring.position.set(0, ht * 0.55, 0);
        g.add(ring);
      }
      return g;
    }

    function buildCity(year, state) {
      if (state.cityRoot) {
        state.cityRoot.parent?.remove(state.cityRoot);
        disposeGroup(state.cityRoot);
      }
      state.cityRoot = new THREE.Group();
      const preset = ERA_PRESETS[year];
      const seed = year * 1337 + 42;
      const rand = mulberry32(seed);

      if (!textures.road) textures.road = makeRoadTexture();
      if (!textures.sidewalk) textures.sidewalk = makeSidewalkTexture();
      if (!textures.grass) textures.grass = makeGrassTexture();

      const citySize = 96;
      const grass = new THREE.Mesh(
        new THREE.PlaneGeometry(citySize, citySize, 1, 1),
        new THREE.MeshStandardMaterial({ map: textures.grass, color: preset.grassColor, roughness: 1.0, metalness: 0.0 })
      );
      grass.rotation.x = -Math.PI / 2;
      grass.position.y = 0;
      state.cityRoot.add(grass);

      const sidewalkMat = new THREE.MeshStandardMaterial({
        map: textures.sidewalk, color: 0x2f2f34, roughness: 0.95, metalness: 0.03
      });
      const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(citySize * 0.86, citySize * 0.86), sidewalkMat);
      sidewalk.rotation.x = -Math.PI / 2;
      sidewalk.position.y = 0.01;
      state.cityRoot.add(sidewalk);

      const roadMat = new THREE.MeshStandardMaterial({
        map: textures.road, color: preset.streetColor, roughness: 1.0, metalness: 0.02
      });
      const road = new THREE.Mesh(new THREE.PlaneGeometry(citySize * 0.55, citySize * 0.55), roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.y = 0.02;
      state.cityRoot.add(road);

      const laneLines = new THREE.Group();
      const lineColor = preset.neon ? 0x7cfffb : 0xfff2b3;
      const laneMat = new THREE.MeshStandardMaterial({
        color: lineColor,
        emissive: preset.neon ? new THREE.Color(lineColor) : new THREE.Color(0x000000),
        emissiveIntensity: preset.neon ? 0.35 : 0,
        roughness: 0.4, metalness: 0
      });
      for (let i = -3; i <= 3; i++) {
        const dash = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.01, 10), laneMat);
        dash.position.set(i * 6, 0.035, 0);
        laneLines.add(dash);
      }
      for (let i = -2; i <= 2; i++) {
        const cross = new THREE.Mesh(new THREE.BoxGeometry(10, 0.01, 1.2), laneMat);
        cross.position.set(0, 0.035, i * 6);
        laneLines.add(cross);
      }
      state.cityRoot.add(laneLines);

      const buildingAreaHalf = citySize * 0.36;
      const rings = 2;
      const perRing = 10;
      for (let ring = 0; ring < rings; ring++) {
        const r = buildingAreaHalf - ring * 9;
        for (let i = 0; i < perRing; i++) {
          const ang = (i / perRing) * Math.PI * 2 + rand() * 0.25;
          const x = Math.cos(ang) * r + seededRange(rand, -1.2, 1.2);
          const z = Math.sin(ang) * r + seededRange(rand, -1.2, 1.2);
          if (Math.hypot(x, z) < citySize * 0.23) continue;
          const b = createBuilding(rand, preset, x, z);
          b.rotation.y = (rand() - 0.5) * 0.12;
          state.cityRoot.add(b);
          if (rand() > 0.6) {
            const lamp = createStreetFurniture(rand, preset, x * 1.02, z * 1.02, 'lamp');
            state.cityRoot.add(lamp);
          }
          if (rand() > 0.75) {
            const bb = createStreetFurniture(rand, preset, x * 1.03, z * 1.03, 'billboard');
            state.cityRoot.add(bb);
          }
        }
      }

      const treeCount = 10 + Math.floor((year - 1945) / 30);
      for (let i = 0; i < treeCount; i++) {
        const x = seededRange(rand, -citySize * 0.4, citySize * 0.4);
        const z = seededRange(rand, -citySize * 0.4, citySize * 0.4);
        const dist = Math.hypot(x, z);
        if (dist < citySize * 0.27 || dist > citySize * 0.42) continue;
        const trunkH = 0.8 + rand() * 1.4;
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.05, 0.09, trunkH, 8),
          new THREE.MeshStandardMaterial({ color: 0x4a2f2a, roughness: 0.85, metalness: 0.1 })
        );
        trunk.position.y = trunkH / 2;
        const leafColor = year >= 2025 ? 0x00ff88 : pick(rand, [0x1ac55a, 0x2aa55b, 0x0f7a40, 0x3cb371]);
        const leaves = new THREE.Mesh(
          new THREE.SphereGeometry(0.55 + rand() * 0.45, 10, 10),
          new THREE.MeshStandardMaterial({
            color: leafColor, roughness: 1, metalness: 0,
            emissive: preset.neon ? new THREE.Color(leafColor) : new THREE.Color(0x000000),
            emissiveIntensity: preset.neon ? 0.12 + rand() * 0.18 : 0
          })
        );
        leaves.position.y = trunkH + 0.6;
        const tree = new THREE.Group();
        tree.add(trunk); tree.add(leaves);
        tree.position.set(x, 0, z);
        state.cityRoot.add(tree);
      }

      const carCount = 10 + Math.floor((year - 1945) / 12);
      for (let i = 0; i < carCount; i++) {
        const t = createVehicle(rand, preset);
        const laneIdx = i % 4;
        const laneX = (laneIdx - 1.5) * 6;
        const z = seededRange(rand, -citySize * 0.22, citySize * 0.22);
        t.position.set(laneX + seededRange(rand, -1.4, 1.4), 0.23, z);
        t.rotation.y = rand() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
        state.cityRoot.add(t);
      }

      state.pedestrians = [];
      const pedCount = preset.pedestrians.count;
      for (let i = 0; i < pedCount; i++) {
        const p = createPedestrian(rand, preset);
        const x = seededRange(rand, -citySize * 0.32, citySize * 0.32);
        const z = seededRange(rand, -citySize * 0.32, citySize * 0.32);
        if (Math.hypot(x, z) < citySize * 0.25) continue;
        p.position.set(x, 0, z);
        const angle = seededRange(rand, 0, Math.PI * 2);
        const speed = 0.3 + rand() * 0.7;
        p.userData.walk = { angle, speed, seed: rand() };
        state.pedestrians.push(p);
        state.cityRoot.add(p);
      }

      state.sceneProps = { preset };
      return state.cityRoot;
    }

    // ----------------------------
    // Simple Orbit Controls
    // ----------------------------
    class OrbitControls {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;
        this.enabled = true;
        this.enableDamping = true;
        this.dampingFactor = 0.05;
        this.enablePan = true;
        this.minDistance = 0;
        this.maxDistance = Infinity;
        this.target = new THREE.Vector3();
        this._rotateStart = new THREE.Vector2();
        this._rotateEnd = new THREE.Vector2();
        this._rotateDelta = new THREE.Vector2();
        this._quaternion = new THREE.Quaternion();
        this._addEventListeners();
      }
      _addEventListeners() {
        this.domElement.addEventListener('contextmenu', (e) => { if (!this.enabled) return; e.preventDefault(); });
        this.domElement.addEventListener('wheel', this._onWheel.bind(this), { passive: false });
        this.domElement.addEventListener('mousedown', this._onMouseDown.bind(this));
        document.addEventListener('mousemove', this._onMouseMove.bind(this));
        document.addEventListener('mouseup', this._onMouseUp.bind(this));
      }
      _onWheel(e) {
        if (!this.enabled) return;
        e.preventDefault();
        const delta = Math.max(0, Math.min(256, e.deltaY));
        const dist = this.camera.position.distanceTo(this.target);
        const scale = THREE.MathUtils.clamp(dist * (1 - delta * e.deltaMode / 100), this.minDistance, this.maxDistance);
        const dir = new THREE.Vector3().subVectors(this.camera.position, this.target).normalize();
        this.camera.position.copy(this.target).addScaledVector(dir, scale);
      }
      _onMouseDown(e) {
        if (!this.enabled) return;
        e.preventDefault();
        this.domElement.focus();
        this._rotateStart.set(e.clientX, e.clientY);
      }
      _onMouseMove(e) {
        if (!this.enabled) return;
        e.preventDefault();
        this._rotateEnd.set(e.clientX, e.clientY);
        this._rotateDelta.subVectors(this._rotateEnd, this._rotateStart).multiplyScalar(0.3);
        this._rotateStart.copy(this._rotateEnd);
        const theta = (Math.PI * this._rotateDelta.x) / 360;
        const phi = (Math.PI * this._rotateDelta.y) / 360;
        const offset = new THREE.Vector3().subVectors(this.camera.position, this.target);
        this._quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), theta);
        offset.applyQuaternion(this._quaternion);
        const up = new THREE.Vector3(0, 1, 0);
        const proj = new THREE.Vector3().projectOnPlane(new THREE.Vector3(0, 1, 0).applyQuaternion(this._quaternion), up).normalize();
        const rot = new THREE.Quaternion().setFromAxisAngle(proj, phi);
        offset.applyQuaternion(rot);
        this.camera.position.copy(this.target).add(offset);
        this.camera.lookAt(this.target);
      }
      _onMouseUp() {}
      update() {}
    }

    // ----------------------------
    // App init
    // ----------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 600);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    document.getElementById('3d-scene').appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, document.getElementById('3d-scene'));
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 6;
    controls.maxDistance = 90;
    controls.target.set(0, 2.5, 0);

    // Lighting
    const hemi = new THREE.HemisphereLight(0xddefff, 0x0c0c12, 0.9);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(25, 65, 20);
    scene.add(dir);

    // Dust particles
    const dustGeo = new THREE.BufferGeometry();
    const dustCount = 900;
    const pos = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      const r = Math.random() * 70;
      const a = Math.random() * Math.PI * 2;
      const y = 2 + Math.random() * 45;
      pos[i * 3 + 0] = Math.cos(a) * r;
      pos[i * 3 + 1] = y;
      pos[i * 3 + 2] = Math.sin(a) * r;
    }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const dustMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.06, opacity: 0.12, transparent: true });
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);

    camera.position.set(22, 14, 28);
    scene.fog = new THREE.Fog(0xffffff, 20, 140);

    const state = { cityRoot: null, pedestrians: [], sceneProps: null };
    const sfx = new CitySFX(camera);

    // Timeline UI
    const yearSlider = document.getElementById('yearSlider');
    const yearPill = document.getElementById('yearPill');
    const eraDesc = document.getElementById('eraDesc');
    let currentIndex = 0;
    let currentYear = YEARS[currentIndex];

    function setEraByIndex(idx, { playSfx = true } = {}) {
      currentIndex = Math.max(0, Math.min(YEARS.length - 1, idx));
      currentYear = YEARS[currentIndex];
      yearSlider.value = String(currentIndex);
      yearPill.textContent = String(currentYear);
      const preset = ERA_PRESETS[currentYear];
      scene.background = new THREE.Color(preset.sky);
      scene.fog = new THREE.Fog(preset.fog, preset.fogNear, preset.fogFar);
      buildCity(currentYear, state);
      controls.target.set(0, 2.4 + (currentIndex * 0.15), 0);
      eraDesc.textContent = preset.description;
      if (playSfx) { sfx.setProfile(preset.sfxProfile); sfx.blip(); }
    }

    yearSlider.addEventListener('input', (e) => {
      const idx = Number(e.target.value);
      setEraByIndex(idx, { playSfx: movementEnabled });
    });

    setEraByIndex(0, { playSfx: false });

    // Movement controls
    const keys = new Set();
    let movementEnabled = false;
    const move = { forward: false, backward: false, left: false, right: false };
    function syncMoveFromKeys() {
      move.forward = keys.has('KeyW');
      move.backward = keys.has('KeyS');
      move.left = keys.has('KeyA');
      move.right = keys.has('KeyD');
    }
    document.getElementById('3d-scene').addEventListener('pointerdown', async () => {
      movementEnabled = true;
      document.getElementById('cursorHint').style.display = 'none';
      await sfx.start();
    });
    window.addEventListener('keydown', (e) => { keys.add(e.code); syncMoveFromKeys(); });
    window.addEventListener('keyup', (e) => { keys.delete(e.code); syncMoveFromKeys(); });

    // Animation
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      dust.rotation.y += dt * 0.06;

      if (state.pedestrians?.length) {
        for (let i = 0; i < state.pedestrians.length; i++) {
          const p = state.pedestrians[i];
          const walk = p.userData.walk;
          if (!walk) continue;
          const wobble = Math.sin((clock.elapsedTime * 1.2) + walk.seed * 10) * 0.006;
          p.position.x += Math.cos(walk.angle) * walk.speed * dt;
          p.position.z += Math.sin(walk.angle) * walk.speed * dt;
          p.rotation.y += dt * 0.8;
          p.position.y = 0;
          if (Math.hypot(p.position.x, p.position.z) > 34) {
            walk.angle += Math.PI * 0.5;
            p.position.x += Math.cos(walk.angle) * 0.3;
            p.position.z += Math.sin(walk.angle) * 0.3;
          }
          p.position.x += wobble;
        }
      }

      if (state.cityRoot) {
        state.cityRoot.children.forEach((obj) => {
          if (obj.type === 'Group' && obj.children?.length) {
            for (const ch of obj.children) {
              if (ch.geometry && ch.geometry.type === 'CylinderGeometry') {
                ch.rotation.z += dt * 4.2;
              }
            }
            obj.position.y += Math.sin(clock.elapsedTime * 3 + obj.position.x * 0.1) * dt * 0.03;
          }
        });
      }

      if (movementEnabled) {
        const speed = 10;
        const vx = (move.right ? 1 : 0) - (move.left ? 1 : 0);
        const vz = (move.backward ? 1 : 0) - (move.forward ? 1 : 0);
        if (vx !== 0 || vz !== 0) {
          const direction = new THREE.Vector3();
          camera.getWorldDirection(direction);
          direction.y = 0;
          direction.normalize();
          const right = new THREE.Vector3().crossVectors(direction, new THREE.Vector3(0, 1, 0)).normalize();
          const delta = new THREE.Vector3();
          delta.addScaledVector(direction, vz * speed * dt);
          delta.addScaledVector(right, vx * speed * dt);
          camera.position.add(delta);
          controls.target.add(delta);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log('City Era Timelapse 3D initialized');
  </script>
</body>
