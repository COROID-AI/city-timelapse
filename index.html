<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Time Period Timelapse</title>
  </head>
  <body>
    <div id="app">
      <!-- The top timeline is built entirely by src/ui/timeline.ts (createTimeline)
           and mounted here. Keeping this a pure mount avoids a duplicate/static
           timeline that overlapped the dynamic one and swallowed pointer events. -->
      <div id="timeline" class="timeline-mount" aria-label="Time period selector"></div>
      <div id="scene" class="scene">
        <canvas id="view" class="view" aria-label="3D city block scene"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
