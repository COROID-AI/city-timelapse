<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Era Timelapse — 1945 to 2025</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #canvas-container { position: fixed; inset: 0; z-index: 0; }
      #ui-placeholder {
        position: fixed; top: 0; left: 0; right: 0; z-index: 10;
        pointer-events: none; min-height: 60px;
      }
      #loading-screen {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: #111; color: #fff; font-family: system-ui, sans-serif;
        font-size: 1.5rem; transition: opacity 0.6s ease;
      }
      #loading-screen.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="ui-placeholder"></div>
    <div id="loading-screen">Loading scene…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
