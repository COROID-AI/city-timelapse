<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2387ceeb'/%3E%3C/svg%3E"
    />
    <title>City Time Period Timelapse</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js"
        }
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
        background: #ffffff;
      }

      .timeline-slider {
        width: 420px;
        max-width: 80vw;
      }

      .timeline-slider-container {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(6px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        display: grid;
        gap: 6px;
        justify-items: center;
        z-index: 10;
      }

      .timeline-era-label {
        font-weight: 700;
        font-size: 14px;
        color: #111;
      }

      .timeline-era-description {
        font-size: 12px;
        color: #333;
        text-align: center;
        max-width: 52ch;
      }

      .timeline-tick-marks {
        position: relative;
        width: 420px;
        max-width: 80vw;
        height: 18px;
      }

      .timeline-tick {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        width: 2px;
        height: 10px;
        background: rgba(0, 0, 0, 0.2);
      }

      .timeline-tick-label {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 10px;
        color: rgba(0, 0, 0, 0.65);
        white-space: nowrap;
      }

      .timeline-tick.active {
        background: rgba(0, 0, 0, 0.55);
      }

      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 10px 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        z-index: 20;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Three.js canvas will be created here by scene.ts -->
  <div id="loading">Loading…</div>
</div>
    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
