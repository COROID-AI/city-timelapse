<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Street Racer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2305060f'/%3E%3Ccircle cx='8' cy='8' r='4' fill='none' stroke='%23ff2bd6' stroke-width='2'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05060f;
      }
      #game-root {
        position: fixed;
        inset: 0;
        background: #05060f;
        overflow: hidden;
      }
      #game-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* HUD overlay mounts its own neon panels inside this layer. */
      #neon-hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* Restart control (also bound to the R key). */
      #restart-button {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        z-index: 20;
        padding: 10px 22px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #dffaff;
        background: rgba(8, 12, 26, 0.85);
        border: 1px solid rgba(0, 229, 255, 0.55);
        border-radius: 10px;
        box-shadow:
          0 0 14px rgba(0, 229, 255, 0.35),
          0 0 2px rgba(255, 43, 214, 0.4);
        cursor: pointer;
        user-select: none;
      }
      #restart-button:hover {
        background: rgba(20, 30, 60, 0.9);
        box-shadow:
          0 0 20px rgba(0, 229, 255, 0.6),
          0 0 3px rgba(255, 43, 214, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="neon-hud"></div>
      <button id="restart-button" type="button">R / Restart</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
