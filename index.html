<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Era Timelapse 1945-2055</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }
        #timeline-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
        }
        #timeline-label {
            margin-bottom: 10px;
            text-align: center;
            font-size: 18px;
        }
        #timeline-slider {
            width: 300px;
        }
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            max-width: 250px;
            z-index: 1000;
        }
        .era-info {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="timeline-container">
        <div id="timeline-label">Select Era: <span id="selected-year">1945</span></div>
        <input type="range" id="timeline-slider" min="0" max="5" step="1" value="0">
        <div id="timeline-marks">
            <span>1945</span>
            <span>1965</span>
            <span>1985</span>
            <span>2005</span>
            <span>2025</span>
            <span>2055</span>
        </div>
    </div>
    
    <div id="info-panel">
        <div class="era-info" id="era-description">
            Loading era information...
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
