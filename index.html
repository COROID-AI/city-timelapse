<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-F" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Time Period Timelapse</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="timeline-header">
      <div class="timeline-label">Timeline:</div>
      <input type="range" id="timeline-slider" min="0" max="5" value="4" />
      <div class="current-year" id="current-year">2025</div>
      <div class="timeline-labels">
        <span>1945</span>
        <span>1965</span>
        <span>1985</span>
        <span>2005</span>
        <span>2025</span>
        <span>2055</span>
      </div>
    </div>

    <div class="scene-container">
      <canvas id="three-canvas"></canvas>
      <div id="loading-indicator" class="loading-indicator">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading assets...</div>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
