<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0e17'/%3E%3Crect x='2' y='3' width='3' height='10' fill='%23f4b95f'/%3E%3Crect x='6.5' y='5' width='3' height='8' fill='%237ae8ff'/%3E%3Crect x='11' y='2' width='3' height='11' fill='%23c8d2e8'/%3E%3C/svg%3E" />
    <title>City Time Period Timelapse</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e17;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(1200px 500px at 50% 110%, rgba(255, 180, 60, 0.16), transparent 60%),
          linear-gradient(180deg, #0f1424 0%, #1a2138 55%, #0b0e17 100%);
        color: #e8ecf5;
        z-index: 30;
        transition: opacity 0.7s ease, visibility 0.7s ease;
      }
      #boot.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-title {
        font-size: 22px;
        letter-spacing: 0.06em;
      }
      .boot-sub {
        font-size: 13px;
        color: #9aa6c0;
        max-width: 460px;
        text-align: center;
        line-height: 1.6;
      }
      .boot-status {
        font-size: 13px;
        color: #f4b95f;
        min-height: 20px;
      }
      .boot-badges {
        display: flex;
        gap: 10px;
        font-size: 11px;
        color: #c6cfe8;
        letter-spacing: 0.1em;
      }
      #boot button {
        padding: 11px 26px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }
      #boot button:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-1px);
      }
      #fallback {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: #0b0e17;
        color: #e8ecf5;
        z-index: 40;
        padding: 24px;
        text-align: center;
      }
      #fallback.visible {
        display: flex;
      }
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        box-shadow: inset 0 0 160px rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="vignette"></div>

    <div id="boot" role="status" aria-live="polite">
      <div class="boot-title">City Time Period Timelapse</div>
      <div class="boot-sub">
        A procedural 3D city block that transforms between 1945 and 2025.
        Audio is synthesized live with Web Audio — nothing is downloaded.
      </div>
      <div class="boot-status" id="boot-status">Initializing…</div>
      <button id="boot-enter" type="button">Enter the block</button>
      <div class="boot-badges">1945 · 1965 · 1985 · 2005 · 2025</div>
    </div>

    <div id="fallback" role="alert">
      <div>
        <strong>WebGL is not available</strong><br />
        This scene requires WebGL 2 (or WebGL 1) support in your browser.
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
