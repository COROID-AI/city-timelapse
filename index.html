<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%231a1a2e'/%3E%3Crect x='4' y='6' width='3' height='8' fill='%236a8acf'/%3E%3Crect x='9' y='3' width='3' height='11' fill='%236a8acf'/%3E%3C/svg%3E" />
  <title>City Time Period Timelapse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #scene { display: block; width: 100vw; height: 100vh; }

    .timeline-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 16px 24px 12px;
      background: linear-gradient(to bottom, rgba(10, 10, 20, 0.82), rgba(10, 10, 20, 0));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .timeline-bar > * { pointer-events: auto; }

    .timeline-title {
      color: #c8d0e0;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .era-name {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .timeline-slider-wrap {
      display: flex;
      align-items: center;
      width: min(640px, 90vw);
    }

    #timeline {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    #timeline::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #6a8acf;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }
    #timeline::-moz-range-thumb {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #6a8acf;
      cursor: pointer;
      border: 2px solid #fff;
    }

    .year-labels {
      display: flex;
      justify-content: space-between;
      width: min(640px, 90vw);
      color: rgba(255, 255, 255, 0.55);
      font-size: 12px;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="timeline-bar">
    <div class="timeline-title">City Timeline</div>
    <div class="era-name" id="era-name">Postwar Recovery</div>
    <div class="timeline-slider-wrap">
      <input type="range" id="timeline" min="0" max="4" step="1" value="0" />
    </div>
    <div class="year-labels">
      <span>1945</span><span>1965</span><span>1985</span><span>2005</span><span>2025</span>
    </div>
  </div>

  <div class="hint">Click to enable audio &middot; Drag to orbit &middot; Scroll to zoom &middot; Right-drag to pan</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
