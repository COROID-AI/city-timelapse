<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Street Racer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <!-- HUD -->
      <div id="hud">
        <div id="top-left">
          <div id="lap"><span id="lap-num">1 / 3</span></div>
          <div class="timer-row">
            <span class="tlabel">LAP</span>
            <span id="lap-time">0:00.00</span>
          </div>
          <div class="timer-row">
            <span class="tlabel">RACE</span>
            <span id="total-time">0:00.00</span>
          </div>
          <div id="drift">DRIFT</div>
        </div>

        <div id="top-right">
          <div id="standings-title">STANDINGS</div>
          <ol id="standings"></ol>
        </div>

        <div id="bottom-left">
          <div id="speed-wrap"><span id="speed">0</span><span id="unit">KM/H</span></div>
        </div>

        <div id="bottom-right">
          <div id="nitro-wrap">
            <div id="nitro-label">NITRO</div>
            <div id="nitro-track"><div id="nitro-fill"></div></div>
            <div id="nitro-keys">SHIFT / X</div>
          </div>
        </div>
      </div>

      <!-- Countdown overlay -->
      <div id="countdown" class="overlay">
        <div id="countdown-num">3</div>
      </div>

      <!-- Finish overlay -->
      <div id="finish" class="overlay">
        <h1 id="finish-title">Race Complete</h1>
        <div id="final-time"></div>
        <ol id="finish-list"></ol>
        <div id="finish-hint">Press <b>R</b> to restart</div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
