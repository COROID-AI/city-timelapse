<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" href="data:," />
    <title>City Time Period Timelapse</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0c12;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      #canvas:active {
        cursor: grabbing;
      }

      #loading-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0a0c12;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s ease;
        pointer-events: none;
      }

      #loading-overlay .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #c8102e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      #loading-overlay .label {
        position: absolute;
        bottom: 40%;
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #hint-overlay {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 500;
        background: rgba(10, 12, 18, 0.7);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: rgba(255, 255, 255, 0.6);
        padding: 8px 16px;
        border-radius: 8px;
        font-size: 12px;
        letter-spacing: 0.5px;
        pointer-events: none;
        transition: opacity 1s ease;
      }

      #hint-overlay kbd {
        display: inline-block;
        padding: 2px 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        font-size: 11px;
        margin: 0 2px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="label">Loading city…</div>
    </div>

    <div id="hint-overlay">
      <kbd>Drag</kbd> orbit &middot; <kbd>Scroll</kbd> zoom &middot; <kbd>C</kbd> walk mode
    </div>

    <!-- Import map: resolve bare module specifier "three" to the ESM build -->
    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "three/jsm": "./node_modules/three/examples/jsm/"
        }
      }
    </script>

    <!-- The compiled main.ts output is loaded as an ES module -->
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
