<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>City Timelapse 1945–2025</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #container { position: fixed; inset: 0; z-index: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; inset: 0; z-index: 1;
        pointer-events: none;
      }
      /* Loading overlay */
      .loading-overlay {
        position: fixed; inset: 0; z-index: 200;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        opacity: 0; pointer-events: none;
        transition: opacity 0.4s ease;
      }
      .loading-overlay.visible {
        opacity: 1; pointer-events: auto;
      }
      .loading-content { text-align: center; color: #fff; }
      .loading-spinner {
        width: 48px; height: 48px; margin: 0 auto 16px;
        border: 4px solid rgba(255,255,255,0.15);
        border-top-color: #f0c040;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-message { font-size: 16px; margin-bottom: 12px; color: #ccc; }
      .loading-bar {
        width: 240px; height: 6px; background: rgba(255,255,255,0.1);
        border-radius: 3px; overflow: hidden; margin: 0 auto;
      }
      .loading-bar-inner {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #f0c040, #ff6040);
        border-radius: 3px;
        transition: width 0.2s ease;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas id="webgl-canvas"></canvas>
    </div>
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-content">
        <div class="loading-spinner"></div>
        <div class="loading-message">Loading…</div>
        <div class="loading-bar"><div class="loading-bar-inner"></div></div>
      </div>
    </div>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
