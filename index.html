<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="description" content="A 3D city block that transforms across five eras: 1945, 1965, 1985, 2005 and 2025." />
    <title>City Timelapse</title>
  </head>
  <body>
    <div id="scene-container" class="scene-container"></div>

    <!-- Timeline UI root (present in served HTML; stops are injected by JS) -->
    <nav id="timeline" class="timeline" aria-label="Era timeline"></nav>

    <!-- HUD: current era label + audio mute toggle -->
    <div id="hud" class="hud">
      <div id="era-label" class="era-label">1945</div>
      <button id="mute-toggle" class="mute-toggle" type="button" aria-pressed="false" title="Toggle sound">
        <span class="mute-icon">♪</span>
      </button>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <div id="transition-overlay" class="transition-overlay"></div>

    <div id="loading" class="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Building the city…</div>
    </div>

    <div id="webgl-fallback" class="webgl-fallback" hidden>
      <h1>WebGL unavailable</h1>
      <p>Your browser or environment does not support WebGL, which is required to render the 3D city.</p>
      <p>The timeline is still available above.</p>
    </div>

    <noscript>This experience requires JavaScript and WebGL.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
